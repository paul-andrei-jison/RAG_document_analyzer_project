<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Document Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0d1117] text-gray-100 h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation Bar -->
    <nav class="bg-[#161b22] border-b border-gray-800 px-6 py-3 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-sm text-white select-none">AI</div>
            <span class="font-semibold text-white text-lg">RAG Analyzer</span>
            <span class="text-gray-500 text-xs bg-gray-800 px-2 py-0.5 rounded-full">Local</span>
        </div>

        <div class="flex items-center gap-3">
            <!-- Model Selector -->
            <div class="flex items-center gap-2">
                <span class="text-xs text-gray-500">Model:</span>
                <select id="modelSelect" class="bg-[#21262d] border border-gray-700 text-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-blue-500 cursor-pointer">
                    <option value="llama3.2" selected>Llama 3.2 (3B)</option>
                    <option value="llama3.1">Llama 3.1 (8B)</option>
                    <option value="mistral">Mistral (7B)</option>
                    <option value="phi3">Phi-3 Mini</option>
                </select>
            </div>

            <!-- Status Badge -->
            <div class="flex items-center gap-2 bg-[#21262d] border border-gray-700 rounded-lg px-3 py-1.5">
                <div id="statusDot" class="w-2 h-2 rounded-full bg-gray-500 animate-pulse"></div>
                <span id="statusText" class="text-gray-400 text-xs">Checking...</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="flex flex-1 overflow-hidden">

        <!-- Left Sidebar -->
        <aside class="w-80 bg-[#161b22] border-r border-gray-800 flex flex-col shrink-0">

            <!-- Upload Section -->
            <div class="p-4 border-b border-gray-800 shrink-0">
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Document</h3>
                <label for="fileInput"
                    class="flex flex-col items-center justify-center w-full h-20 border-2 border-dashed border-gray-700 rounded-lg cursor-pointer hover:border-blue-500 hover:bg-blue-500/5 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-600 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                    <span class="text-xs text-gray-500">Click to select PDF or TXT</span>
                    <input id="fileInput" type="file" accept=".pdf,.txt" class="hidden" onchange="handleFileSelect()">
                </label>
                <p id="fileNameDisplay" class="text-xs text-gray-500 mt-2 truncate hidden"></p>
                <button id="uploadBtn" onclick="uploadFile()" disabled
                    class="mt-2 w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-medium py-2 rounded-lg transition-colors">
                    Upload &amp; Ingest
                </button>
                <p id="uploadStatus" class="text-xs text-gray-500 text-center mt-2 min-h-[1rem]"></p>
            </div>

            <!-- Summary Section -->
            <div class="flex-1 flex flex-col p-4 overflow-hidden">
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3 shrink-0">Summary</h3>
                <div id="summaryArea" class="flex-1 overflow-y-auto">
                    <div class="flex flex-col items-center justify-center h-full gap-2 text-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        <p class="text-gray-600 text-xs">Summary will appear here after upload</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Chat Area -->
        <main class="flex-1 flex flex-col overflow-hidden">

            <!-- Chat Log -->
            <div id="chatLog" class="flex-1 overflow-y-auto p-6 space-y-4">
                <div id="welcomeMsg" class="flex flex-col items-center justify-center h-full gap-3 text-center">
                    <div class="w-16 h-16 bg-blue-600/10 border border-blue-600/20 rounded-2xl flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                        </svg>
                    </div>
                    <h2 class="text-xl font-semibold text-white">RAG Document Analyzer</h2>
                    <p class="text-gray-500 text-sm max-w-sm">Upload a document on the left, then ask questions about its contents using any supported model.</p>
                </div>
            </div>

            <!-- Chat Input -->
            <div class="border-t border-gray-800 bg-[#161b22] p-4">
                <div class="flex gap-3 items-center">
                    <button id="docOnlyBtn" onclick="toggleDocOnly()"
                        title="Toggle between document-only and open knowledge"
                        class="shrink-0 flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-medium border transition-colors bg-blue-600/20 border-blue-500 text-blue-300">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        Doc Only
                    </button>
                    <input id="queryInput" type="text" placeholder="Ask a question about your document..." disabled
                        onkeypress="handleEnter(event)"
                        class="flex-1 bg-[#21262d] border border-gray-700 text-gray-200 placeholder-gray-600 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 disabled:opacity-40 transition-colors">
                    <button id="sendBtn" onclick="sendQuery()" disabled
                        class="bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed text-white px-5 py-3 rounded-xl text-sm font-medium transition-colors shrink-0">
                        Send
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentDocId = null;
        let currentAbort = null;
        let docOnly = true;

        function toggleDocOnly() {
            docOnly = !docOnly;
            const btn = document.getElementById('docOnlyBtn');
            if (docOnly) {
                btn.className = 'shrink-0 flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-medium border transition-colors bg-blue-600/20 border-blue-500 text-blue-300';
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg> Doc Only`;
            } else {
                btn.className = 'shrink-0 flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-medium border transition-colors bg-purple-600/20 border-purple-500 text-purple-300';
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9" /></svg> Open`;
            }
        }

        function stopOperation() {
            if (currentAbort) {
                currentAbort.abort();
                currentAbort = null;
            }
        }

        function getSelectedModel() {
            return document.getElementById('modelSelect').value;
        }

        // --- Status Check ---
        async function checkStatus() {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            try {
                const res = await fetch('/status');
                const data = await res.json();
                if (data.status === 'online') {
                    dot.className = 'w-2 h-2 rounded-full bg-green-400';
                    text.className = 'text-green-400 text-xs';
                    text.innerText = 'Ollama Ready';
                } else {
                    dot.className = 'w-2 h-2 rounded-full bg-yellow-400';
                    text.className = 'text-yellow-400 text-xs';
                    text.innerText = 'Ollama Offline';
                }
            } catch {
                dot.className = 'w-2 h-2 rounded-full bg-red-400';
                text.className = 'text-red-400 text-xs';
                text.innerText = 'Backend Offline';
            }
        }

        // --- File Handling ---
        function handleFileSelect() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return;
            const display = document.getElementById('fileNameDisplay');
            display.innerText = file.name;
            display.classList.remove('hidden');
            document.getElementById('uploadBtn').disabled = false;
        }

        // --- Upload ---
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files[0]) return;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            const statusEl = document.getElementById('uploadStatus');
            const uploadBtn = document.getElementById('uploadBtn');
            statusEl.innerText = 'Ingesting...';
            uploadBtn.innerText = 'Stop';
            uploadBtn.onclick = stopOperation;
            uploadBtn.classList.replace('bg-blue-600', 'bg-red-600');
            uploadBtn.classList.replace('hover:bg-blue-700', 'hover:bg-red-700');

            currentAbort = new AbortController();

            try {
                const res = await fetch('/upload', { method: 'POST', body: formData, signal: currentAbort.signal });
                const data = await res.json();

                if (res.ok) {
                    currentDocId = data.doc_id;
                    statusEl.innerText = `✓ ${data.chunk_count} chunks ingested`;
                    document.getElementById('queryInput').disabled = false;
                    document.getElementById('sendBtn').disabled = false;
                    document.getElementById('welcomeMsg')?.remove();
                    generateSummary();
                } else {
                    statusEl.innerText = 'Upload failed.';
                    alert(data.detail);
                }
            } catch (err) {
                statusEl.innerText = err.name === 'AbortError' ? 'Stopped.' : 'Error connecting to backend.';
                if (err.name !== 'AbortError') console.error(err);
            } finally {
                currentAbort = null;
                uploadBtn.innerText = 'Upload & Ingest';
                uploadBtn.onclick = uploadFile;
                uploadBtn.classList.replace('bg-red-600', 'bg-blue-600');
                uploadBtn.classList.replace('hover:bg-red-700', 'hover:bg-blue-700');
                uploadBtn.disabled = false;
            }
        }

        // --- Summary ---
        async function generateSummary() {
            const area = document.getElementById('summaryArea');
            area.innerHTML = '<div class="flex items-center gap-2 text-gray-500 text-xs p-1"><div class="w-3 h-3 border-2 border-blue-400 border-t-transparent rounded-full animate-spin shrink-0"></div>Generating summary...<button onclick="stopOperation()" class="ml-2 text-red-400 hover:text-red-300 text-xs">✕ Stop</button></div>';

            const model_id = getSelectedModel();
            currentAbort = new AbortController();
            try {
                const res = await fetch('/summarize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ doc_id: currentDocId, model_id }),
                    signal: currentAbort.signal
                });
                const data = await res.json();
                area.className = 'flex-1 overflow-y-auto text-sm text-gray-300 leading-relaxed whitespace-pre-wrap';
                area.innerText = data.summary;
            } catch (err) {
                area.innerHTML = err.name === 'AbortError'
                    ? '<p class="text-gray-500 text-xs italic p-1">Summary stopped.</p>'
                    : '<p class="text-xs p-1">Failed to generate summary.</p>';
            } finally {
                currentAbort = null;
            }
        }

        // --- Chat ---
        async function sendQuery() {
            const input = document.getElementById('queryInput');
            const query = input.value.trim();
            if (!query || !currentDocId) return;

            appendMessage(query, 'user');
            input.value = '';
            const loaderId = appendMessage('', 'ai', true);
            const model_id = getSelectedModel();

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.innerText = 'Stop';
            sendBtn.onclick = stopOperation;
            sendBtn.classList.replace('bg-blue-600', 'bg-red-600');
            sendBtn.classList.replace('hover:bg-blue-700', 'hover:bg-red-700');

            currentAbort = new AbortController();

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ doc_id: currentDocId, query, model_id, doc_only: docOnly }),
                    signal: currentAbort.signal
                });
                const data = await res.json();
                const el = document.getElementById(loaderId);
                if (el) el.innerHTML = data.answer.replace(/\n/g, '<br>');
            } catch (err) {
                const el = document.getElementById(loaderId);
                if (el) el.innerHTML = err.name === 'AbortError'
                    ? '<span class="text-gray-500 italic">Stopped.</span>'
                    : '<span class="text-red-400">Error reaching AI.</span>';
            } finally {
                currentAbort = null;
                sendBtn.innerText = 'Send';
                sendBtn.onclick = sendQuery;
                sendBtn.classList.replace('bg-red-600', 'bg-blue-600');
                sendBtn.classList.replace('hover:bg-red-700', 'hover:bg-blue-700');
            }
        }

        function appendMessage(text, role, isLoader = false) {
            const log = document.getElementById('chatLog');
            const wrapper = document.createElement('div');
            wrapper.className = role === 'user' ? 'flex justify-end' : 'flex justify-start';

            const bubble = document.createElement('div');
            const id = isLoader ? 'loader-' + Date.now() : '';
            if (id) bubble.id = id;

            if (role === 'user') {
                bubble.className = 'bg-blue-600 text-white px-4 py-2.5 rounded-2xl rounded-tr-sm max-w-[75%] text-sm leading-relaxed';
                bubble.innerText = text;
            } else {
                bubble.className = 'bg-[#21262d] border border-gray-700 text-gray-200 px-4 py-2.5 rounded-2xl rounded-tl-sm max-w-[75%] text-sm leading-relaxed';
                bubble.innerHTML = isLoader
                    ? '<div class="flex items-center gap-2 text-gray-500"><div class="w-3 h-3 border-2 border-blue-400 border-t-transparent rounded-full animate-spin"></div>Thinking...</div>'
                    : text;
            }

            wrapper.appendChild(bubble);
            log.appendChild(wrapper);
            log.scrollTop = log.scrollHeight;
            return id;
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendQuery();
        }

        // Init
        checkStatus();
        setInterval(checkStatus, 30000);
    </script>
</body>
</html>
