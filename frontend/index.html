<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local AI Document Chat</title>
    <style>
        :root { --bg: #f9fafb; --border: #e5e7eb; --primary: #3b82f6; --text: #1f2937; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 2rem; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        header { margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: flex-start; }
        .header-controls { display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-end; }
        .api-config { display: flex; align-items: center; gap: 0.5rem; }
        .api-config label { font-size: 0.8rem; color: #6b7280; white-space: nowrap; }
        .api-config input { width: 230px; padding: 0.35rem 0.5rem; border: 1px solid var(--border); border-radius: 4px; font-size: 0.85rem; }
        .api-config button { padding: 0.35rem 0.75rem; font-size: 0.85rem; background: #6b7280; }
        .api-config button:hover { background: #4b5563; }
        .api-save-status { font-size: 0.8rem; color: #10b981; min-width: 38px; }
        .upload-section { background: white; padding: 1rem; border-radius: 8px; border: 1px solid var(--border); }
        .main-content { display: flex; gap: 2rem; flex: 1; overflow: hidden; }
        .panel { flex: 1; background: white; border-radius: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        .panel-header { padding: 1rem; border-bottom: 1px solid var(--border); font-weight: bold; background: #f3f4f6; }
        .panel-body { padding: 1rem; flex: 1; overflow-y: auto; line-height: 1.5; white-space: pre-wrap; }

        /* Chat Specifics */
        .chat-log { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
        .message { padding: 0.75rem 1rem; border-radius: 8px; max-width: 85%; }
        .msg-user { background: var(--primary); color: white; align-self: flex-end; }
        .msg-ai { background: #f3f4f6; align-self: flex-start; }
        .chat-input-area { padding: 1rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; }
        input[type="text"] { flex: 1; padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; }
        button { padding: 0.5rem 1rem; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .loader { color: #6b7280; font-size: 0.9rem; font-style: italic; }
    </style>
</head>
<body>

    <header>
        <h2>Local RAG Pipeline</h2>
        <div class="header-controls">
            <div class="api-config">
                <label for="apiBaseInput">API Endpoint / Tunnel URL:</label>
                <input type="url" id="apiBaseInput" placeholder="http://localhost:8000">
                <button onclick="saveApiBase()">Save</button>
                <span class="api-save-status" id="apiSaveStatus"></span>
            </div>
            <div class="upload-section">
                <input type="file" id="fileInput" accept=".txt,.pdf">
                <button id="uploadBtn" onclick="uploadFile()">1. Upload &amp; Ingest</button>
                <span id="uploadStatus" class="loader"></span>
            </div>
        </div>
    </header>

    <div class="main-content">
        <!-- Left Panel: Summary -->
        <div class="panel">
            <div class="panel-header">Document Summary</div>
            <div class="panel-body" id="summaryArea">
                Upload a document to generate notes...
            </div>
        </div>

        <!-- Right Panel: Chat -->
        <div class="panel">
            <div class="panel-header">Chat with Document</div>
            <div class="chat-log" id="chatLog"></div>
            <div class="chat-input-area">
                <input type="text" id="queryInput" placeholder="Ask a question..." disabled onkeypress="handleEnter(event)">
                <button id="sendBtn" onclick="sendQuery()" disabled>Send</button>
            </div>
        </div>
    </div>

    <script>
        let currentDocId = null;

        function getApiBase() {
            return (localStorage.getItem('apiBase') || 'http://localhost:8000').replace(/\/$/, '');
        }

        function saveApiBase() {
            const input = document.getElementById('apiBaseInput');
            const url = input.value.trim().replace(/\/$/, '') || 'http://localhost:8000';
            localStorage.setItem('apiBase', url);
            input.value = url;
            const status = document.getElementById('apiSaveStatus');
            status.innerText = 'Saved!';
            setTimeout(() => { status.innerText = ''; }, 2000);
        }

        // Populate API URL input from localStorage on page load
        document.getElementById('apiBaseInput').value = localStorage.getItem('apiBase') || 'http://localhost:8000';

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files[0]) return alert("Please select a file.");

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            const status = document.getElementById('uploadStatus');
            status.innerText = "Ingesting and chunking (takes a moment)...";
            document.getElementById('uploadBtn').disabled = true;

            try {
                const response = await fetch(getApiBase() + '/upload', { method: 'POST', body: formData });
                const data = await response.json();

                if (response.ok) {
                    currentDocId = data.doc_id;
                    status.innerText = `Ingested ${data.chunk_count} chunks!`;

                    // Enable chat
                    document.getElementById('queryInput').disabled = false;
                    document.getElementById('sendBtn').disabled = false;

                    // Trigger Summary Map-Reduce
                    generateSummary();
                } else {
                    status.innerText = "Upload failed.";
                    alert(data.detail);
                }
            } catch (err) {
                status.innerText = "Error.";
                console.error(err);
            } finally {
                document.getElementById('uploadBtn').disabled = false;
            }
        }

        async function generateSummary() {
            const summaryArea = document.getElementById('summaryArea');
            summaryArea.innerHTML = "<span class='loader'>Running Map-Reduce summary (this may take a minute on local hardware)...</span>";

            try {
                const response = await fetch(getApiBase() + '/summarize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ doc_id: currentDocId })
                });
                const data = await response.json();
                summaryArea.innerText = data.summary;
            } catch (err) {
                summaryArea.innerText = "Failed to generate summary.";
            }
        }

        async function sendQuery() {
            const input = document.getElementById('queryInput');
            const query = input.value.trim();
            if (!query || !currentDocId) return;

            // Add user message to UI
            appendMessage(query, 'msg-user');
            input.value = '';

            // Add loading state
            const loaderId = appendMessage('Thinking...', 'msg-ai', true);

            try {
                const response = await fetch(getApiBase() + '/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ doc_id: currentDocId, query: query })
                });
                const data = await response.json();

                // Replace loading message with answer
                document.getElementById(loaderId).innerText = data.answer;
            } catch (err) {
                document.getElementById(loaderId).innerText = "Error reaching AI.";
            }
        }

        function appendMessage(text, className, isLoader = false) {
            const log = document.getElementById('chatLog');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            if (isLoader) {
                msgDiv.id = 'loader-' + Date.now();
                msgDiv.style.opacity = '0.6';
            }
            msgDiv.innerText = text;
            log.appendChild(msgDiv);
            log.scrollTop = log.scrollHeight;
            return msgDiv.id;
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendQuery();
        }
    </script>
</body>
</html>
